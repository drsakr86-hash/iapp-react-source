name: CI

# Runs the same checks used locally on every pull request and on pushes to main.
# Nothing here deploys: production is still published by the owner's dist-zip script.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # .env.example holds only the public Supabase URL + publishable key
      # (safe in client code by design); the tests need them to be set.
      - name: Create .env from example
        run: cp .env.example .env

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
